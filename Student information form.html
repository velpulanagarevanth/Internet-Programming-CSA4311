
<!DOCTYPE html>
<html>
<head>
    <title>Student Information</title>
</head>
<body>
    <h2>Student Information Form</h2>

    <form>
        Name: <input type="text" placeholder="Enter name"><br><br>
        Roll Number: <input type="text" placeholder="Enter roll number"><br><br>
        Email: <input type="email" placeholder="Enter email"><br><br>
        Gender:
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female<br><br>
        Department:
        <select>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>IT</option>
        </select><br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Clear">
    </form>
</body>
</html>
